name: Docker Image CI
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 4 * *"
  # Build-only checks (no push)
  push:
    branches: [main]
    paths: &build-paths
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - healthcheck.sh
      - inde/**
      - .github/workflows/docker-image.yml
  pull_request:
    paths: *build-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKER_IMAGE_NAME: docker.io/ndscprm/geonetwork
  # Only scheduled and manual runs publish images
  PUBLISH: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      timestamp: ${{ steps.datetime.outputs.timestamp }}
    steps:
      - name: Current DateTime
        id: datetime
        run: echo "timestamp=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 3.10.2
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Export the base image as a local OCI layout, so the INDE build uses it
      # instead of the image published on Docker Hub
      - name: Build Geonetwork image (${{ matrix.platform }})
        id: base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            GEONETWORK_VERSION=${{ matrix.version }}
          platforms: ${{ matrix.platform }}
          pull: true
          provenance: false
          outputs: type=oci,dest=${{ runner.temp }}/base-oci,tar=false
          cache-from: type=gha,scope=base-${{ matrix.version }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.version }}-${{ matrix.arch }}

      - name: Push Geonetwork image by digest (${{ matrix.platform }})
        id: base-push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            GEONETWORK_VERSION=${{ matrix.version }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Build GN-INDE custom image (${{ matrix.platform }})
        id: inde
        uses: docker/build-push-action@v7
        with:
          context: inde/
          file: inde/Dockerfile
          build-args: |
            GEONETWORK_IMAGE_REPOSITORY=${{ env.DOCKER_IMAGE_NAME }}
            GEONETWORK_IMAGE_TAG=${{ matrix.version }}
          build-contexts: |
            ${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.version }}=oci-layout://${{ runner.temp }}/base-oci@${{ steps.base.outputs.digest }}
          platforms: ${{ matrix.platform }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.DOCKER_IMAGE_NAME) || 'type=cacheonly' }}

      - name: Export digests
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests/base" "$RUNNER_TEMP/digests/inde"
          touch "$RUNNER_TEMP/digests/base/${BASE_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/inde/${INDE_DIGEST#sha256:}"
        env:
          BASE_DIGEST: ${{ steps.base-push.outputs.digest }}
          INDE_DIGEST: ${{ steps.inde.outputs.digest }}

      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        version:
          - 3.10.2
    env:
      TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
      VERSION: ${{ matrix.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.version }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifests
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "$DOCKER_IMAGE_NAME:$VERSION-$TIMESTAMP" \
            -t "$DOCKER_IMAGE_NAME:$VERSION" \
            $(printf "$DOCKER_IMAGE_NAME@sha256:%s " $(ls base))
          docker buildx imagetools create \
            -t "$DOCKER_IMAGE_NAME:$VERSION-inde-$TIMESTAMP" \
            -t "$DOCKER_IMAGE_NAME:$VERSION-inde" \
            $(printf "$DOCKER_IMAGE_NAME@sha256:%s " $(ls inde))

      - name: Inspect images
        run: |
          docker buildx imagetools inspect "$DOCKER_IMAGE_NAME:$VERSION"
          docker buildx imagetools inspect "$DOCKER_IMAGE_NAME:$VERSION-inde"

      - name: Analyze base image for CVEs
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.version }}
          sarif-file: sarif-base.json
          only-severities: critical,high
          summary: true

      # The INDE image is the one usually deployed; it adds a recompiled jar on top of the base
      - name: Analyze INDE image for CVEs
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.DOCKER_IMAGE_NAME }}:${{ matrix.version }}-inde
          sarif-file: sarif-inde.json
          only-severities: critical,high
          summary: true

      # Scout may emit regions with line/column 0, which GitHub rejects (must be >= 1)
      - name: Normalize SARIF regions
        run: |
          for f in sarif-base.json sarif-inde.json; do
            jq 'walk(if type == "object" and has("startLine") then with_entries(if (.key | IN("startLine","startColumn","endLine","endColumn")) and (.value | type == "number") and .value < 1 then .value = 1 else . end) else . end)' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      # A distinct category per image keeps both results in code scanning
      - name: Upload base SARIF result
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-base.json
          category: scout-${{ matrix.version }}

      - name: Upload INDE SARIF result
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-inde.json
          category: scout-${{ matrix.version }}-inde
